# Local stack for the Java API: Supabase Postgres, migrations, fake seed data, the API.
#
#   docker compose up --build       # API on http://localhost:8080
#   docker compose down -v          # wipe the database and start over
#
# Everything here is for local development only. The secrets below are not secrets.

name: devs

services:
  db:
    image: supabase/postgres:17.6.1.062
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    image: flyway/flyway:13.8.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db:/flyway/project:ro
    working_dir: /flyway/project
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
    command: -configFiles=flyway.toml migrate

  # Fake people and events, plus a password for the API's role (set out of band in real projects).
  seed:
    image: supabase/postgres:17.6.1.062
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./db/seed:/seed:ro
    environment:
      PGPASSWORD: postgres
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -h db -U postgres -v ON_ERROR_STOP=1 -q -f /seed/dev_seed.sql &&
        psql -h db -U postgres -c "alter role api_app with password 'api_app_local'"

  api:
    build: ./apps/api
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USER: api_app
      DB_PASSWORD: api_app_local
      SITE_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # No Supabase Auth runs locally: tokens are minted with apps/api/scripts/dev-token.sh.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_JWT_SECRET: local-dev-jwt-secret-not-for-production-0123456789
      STORAGE_MODE: local
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:8080
      EMAIL_MODE: log
    volumes:
      - api-storage:/data/storage

volumes:
  db-data:
  api-storage:
